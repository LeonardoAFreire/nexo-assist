services:
  postgres:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_USER: nexo
      POSTGRES_PASSWORD: nexo
      POSTGRES_DB: nexo
    ports:
      - '5432:5432'
    volumes:
      - nexo-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U nexo -d nexo']
      interval: 5s
      timeout: 3s
      retries: 10

  app:
    build: .
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - '${APP_PORT:-8080}:3000'
    environment:
      NODE_ENV: development
      LOG_LEVEL: info
      DATABASE_URL: postgres://nexo:nexo@postgres:5432/nexo
      WEB_ORIGIN: http://localhost:${APP_PORT:-8080}
      JWT_SECRET: segredo-local-do-docker-com-mais-de-32-caracteres
      LLM_PROVIDER: ${LLM_PROVIDER:-scripted}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      LLM_MODEL: ${LLM_MODEL:-openai/gpt-6-luna}
      LLM_ROUTER_MODEL: ${LLM_ROUTER_MODEL:-deepseek/deepseek-v4-flash-0731}
      LLM_DAILY_BUDGET_USD: ${LLM_DAILY_BUDGET_USD:-2}
      SEED_DEMO_DATA: 'true'

volumes:
  nexo-postgres-data:
