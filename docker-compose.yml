services:
  postgres:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_USER: nexo
      POSTGRES_PASSWORD: nexo
      POSTGRES_DB: nexo
    ports:
      - '5432:5432'
    volumes:
      - nexo-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U nexo -d nexo']
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  nexo-postgres-data:
